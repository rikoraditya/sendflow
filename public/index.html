<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <title>Sendflow Modern UI</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background: linear-gradient(135deg, #e0e7ff, #f8fafc);
      min-height: 100vh;
      font-family: 'Inter', sans-serif;
    }

    .glass-card {
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(12px);
      border-radius: 20px;
      box-shadow: 0px 10px 25px rgba(0,0,0,0.05);
      padding: 22px;
    }

    .table-modern th {
      background: #f1f5f9 !important;
      font-weight: 600;
    }
    .table-modern tbody tr:hover {
      background: #f8fafc;
      transition: 0.2s;
    }

    .status-pill {
      padding: 5px 10px;
      border-radius: 30px;
      font-size: 12px;
      font-weight: 600;
    }
    .pill-success { background: #dcfce7; color:#166534; }
    .pill-pending { background: #fef9c3; color:#854d0e; }
    .pill-failed  { background: #fee2e2; color:#991b1b; }

    .form-control, .btn {
      border-radius: 12px !important;
    }

    .section-title {
      font-weight: 700;
      font-size: 20px;
    }

    .btn-primary {
      background: #4f46e5;
      border: none;
    }
    .btn-primary:hover {
      background: #4338ca;
    }
    .btn-success {
      background: #10b981;
      border: none;
    }

    .header-title {
      font-weight: 800;
      font-size: 28px;
      color: #1e293b;
    }

    .sub-text {
      color: #64748b;
    }
  </style>
</head>
<body class="p-4">

<div class="container">

  <!-- HEADER -->
  <div class="mb-4">
    <h1 class="header-title">Sendflow SMS</h1>
    <div class="sub-text">Sistem pengiriman SMS modern – dengan UI premium</div>
  </div>

  <div class="row g-4">

    <!-- LEFT PANEL -->
    <div class="col-md-4">
      <div class="glass-card">

        <div class="section-title mb-3">Upload Kontak</div>

        <form id="uploadForm">
          <input type="file" id="fileInput" accept=".xlsx,.xls,.csv" class="form-control mb-2">
          <div class="text-muted small mb-3">Format Excel: nik, name, phone</div>

          <button class="btn btn-primary w-100" id="uploadBtn" type="submit">
            Upload & Simpan
          </button>
        </form>

        <hr class="my-4">

        <div class="section-title mb-2">Template Pesan</div>

        <label class="small mb-1">Pesan Utama</label>
        <textarea id="msgTemplate" class="form-control" rows="3">Halo {name}, ini reminder dari Klinik Karya Prima.</textarea>

        <label class="small mt-3 mb-1">Template Reminder</label>
        <textarea id="reminderTemplate" class="form-control" rows="3"></textarea>

        <button class="btn btn-success w-100 mt-3" id="sendBatchBtn">
          Kirim Batch (20 kontak)
        </button>

        <div class="text-muted small mt-3">
          Gunakan placeholder: <code>{name}</code>
        </div>

      </div>
    </div>

    <!-- RIGHT PANEL -->
    <div class="col-md-8">
      <div class="glass-card">

        <div class="d-flex justify-content-between align-items-center mb-3">
          <div class="section-title">Daftar Kontak</div>
          <input type="text" id="searchBox" class="form-control w-50" placeholder="Cari nama / nomor...">
        </div>

        <div class="table-responsive">
          <table class="table table-modern table-hover">
            <thead>
              <tr>
                <th>Nama</th>
                <th>Phone</th>
                <th>Status</th>
                <th>Last Sent</th>
                <th>Last Reply</th>
                <th>Aksi</th>
              </tr>
            </thead>
            <tbody id="contactTableBody">
              <tr>
                <td colspan="6" class="text-center py-4 text-muted">Memuat data...</td>
              </tr>
            </tbody>
          </table>
        </div>

      </div>
    </div>

  </div>
</div>

<!-- MODAL DETAIL -->
<div class="modal fade" id="detailModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content glass-card">
      <div class="modal-header">
        <h5 class="modal-title fw-bold">Detail Kontak</h5>
        <button class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div><b>Nama:</b> <span id="modalName"></span></div>
        <div><b>Phone:</b> <span id="modalPhone"></span></div>
        <div><b>Status:</b> <span id="modalStatus"></span></div>

        <div class="mt-3"><b>Last Reply:</b></div>
        <div id="modalReply" class="border p-2 rounded bg-light"></div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Tutup</button>
      </div>
    </div>
  </div>
</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
/* =============================
   FUNGSI-FUNGSI DASAR (READY)
==============================*/

// Load contacts
async function loadContacts() {
  try {
    const res = await fetch('/api/contacts');
    const data = await res.json();

    const table = document.getElementById("contactTableBody");
    table.innerHTML = "";

    data.forEach(row => {
      const tr = document.createElement("tr");

      tr.innerHTML = `
        <td>${row.name}</td>
        <td>${row.phone}</td>
        <td><span class="status-pill pill-${row.status}">${row.status}</span></td>
        <td>${row.last_sent || "-"}</td>
        <td>${row.last_reply_message || "-"}</td>
        <td>
          <button class="btn btn-sm btn-outline-primary" onclick='showDetail(${JSON.stringify(JSON.stringify(row))})'>
            Detail
          </button>
        </td>
      `;

      table.appendChild(tr);
    });

  } catch (err) {
    console.error(err);
  }
}

// Show detail modal
function showDetail(dataJSON) {
  const row = JSON.parse(dataJSON);
  document.getElementById("modalName").innerText = row.name;
  document.getElementById("modalPhone").innerText = row.phone;
  document.getElementById("modalStatus").innerText = row.status;
  document.getElementById("modalReply").innerText = row.last_reply_message || "-";
  new bootstrap.Modal("#detailModal").show();
}

// Upload Excel
document.getElementById("uploadForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const file = document.getElementById("fileInput").files[0];
  if (!file) return alert("Pilih file!");

  const form = new FormData();
  form.append("file", file);

  const res = await fetch("/api/upload", { method:"POST", body:form });
  const data = await res.json();

  alert(data.message || "Upload selesai");
  loadContacts();
});

// Kirim Batch
document.getElementById("sendBatchBtn").onclick = async () => {
  const body = {
    message_template: document.getElementById("msgTemplate").value,
    reminder_template: document.getElementById("reminderTemplate").value,
  };

  const res = await fetch("/api/send", {
    method:"POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body)
  });

  const data = await res.json();
  alert(data.message || "Batch dikirim");
  loadContacts();
};

// Search filter
document.getElementById("searchBox").addEventListener("input", (e) => {
  const q = e.target.value.toLowerCase();
  document.querySelectorAll("#contactTableBody tr").forEach(tr => {
    const text = tr.innerText.toLowerCase();
    tr.style.display = text.includes(q) ? "" : "none";
  });
});

// Load on start
loadContacts();
</script>

</body>
</html>
